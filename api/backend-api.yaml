openapi: "3.0.3"
info:
  title:
    Fn::Sub: "${AWS::StackName}-backend-apis"
  description:
    Fn::Sub: "Backend APIs for ${AWS::StackName} - Serverless GenAI Document Generator"
  version: "1.0"

paths:
  /documents/upload:
    post:
      summary: Get Pre-signed URL for Document Upload
      description: Returns a pre-signed S3 URL for uploading a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadDocumentRequestBody"
      responses:
        "200":
          description: Successful response with pre-signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDocumentResponseBody"
        "400":
          description: Bad Request - Invalid or missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-amazon-apigateway-request-validator: ValidateBody
      x-amazon-apigateway-integration:
        type: "aws_proxy"
        httpMethod: "POST"
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DocumentIngestionModuleResources.Outputs.UploadDocumentFunctionArn}/invocations"
        credentials:
          Fn::Sub: "${RestApiRole.Arn}"
    options:
      summary: CORS preflight for /documents/upload
      responses:
        "200":
          description: Successful CORS preflight response
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
      x-amazon-apigateway-integration:
        type: "mock"
        responses:
          default:
            statusCode: "200"
            responseParameters:
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
        requestTemplates:
          application/json: '{"statusCode": 200}'

x-amazon-apigateway-request-validators:
  ValidateBody:
    validateRequestBody: true
    validateRequestParameters: false

components:
  schemas:
    UploadDocumentRequestBody:
      type: object
      required:
        - fileName
        - fileType
        - fileSize
      properties:
        fileName:
          type: string
          minLength: 1
          example: "maintenance-manual.pdf"
        fileType:
          type: string
          enum: ["PDF", "DOCX", "TXT", "XLSX", "PPTX"]
          example: "PDF"
        fileSize:
          type: integer
          minimum: 1
          maximum: 10485760
          description: File size in bytes (max 10MB)
          example: 2048576

    UploadDocumentResponseBody:
      type: object
      properties:
        documentId:
          type: string
          example: "DOC-123e4567-e89b-12d3-a456-426614174000"
        uploadUrl:
          type: string
          description: Pre-signed S3 URL for uploading
          example: "https://s3.amazonaws.com/bucket/key?X-Amz-Signature=..."
        expiresIn:
          type: integer
          description: Seconds until URL expires
          example: 3600

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
          nullable: true
        details:
          type: object
          additionalProperties: true
          nullable: true
